spring.application.name=MagicFridgeAI

spring.datasource.url=jdbc:h2:mem:fridge_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do JPA // HIBERNATES
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Configurar o flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

# Configurações API do Gemini
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.api.key=${GEMINI_API_KEY}